# Standalone introduction/download site; no monitor APIs or account sessions.
server {
    listen 80;
    listen [::]:80;
    server_name bettergmgn.com www.bettergmgn.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/bettergmgn-acme; }
    location / { return 301 https://bettergmgn.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bettergmgn.com;
    ssl_certificate /etc/letsencrypt/live/bettergmgn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettergmgn.com/privkey.pem;
    return 301 https://bettergmgn.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bettergmgn.com;
    ssl_certificate /etc/letsencrypt/live/bettergmgn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettergmgn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/bettergmgn/web;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html { return 301 https://bettergmgn.com/$is_args$args; }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /icon128.png { try_files $uri =404; }
    location ~ ^/dl/985gmgn-helper-(?:setup-v[0-9]+\.[0-9]+\.[0-9]+\.exe|v[0-9]+\.[0-9]+\.[0-9]+\.zip)(?:\.sha256)?$ {
        try_files $uri =404;
    }
    location / { return 404; }
}
