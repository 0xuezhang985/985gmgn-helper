name: Sync detailed release notes

on:
  push:
    branches:
      - main
    paths:
      - "release-notes/v*.md"
      - "scripts/build-release-notes.ps1"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (for example v0.46.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync existing GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
            if ($tag -notmatch '^v\d+\.\d+\.\d+(?:\.\d+)?$') {
              throw "版本标签格式无效：$tag"
            }
            $path = "release-notes/$tag.md"
            if (-not (Test-Path -LiteralPath $path)) {
              throw "版本说明不存在：$path"
            }
            $files = @(Get-Item -LiteralPath $path)
          } else {
            $before = '${{ github.event.before }}'
            $after = '${{ github.sha }}'
            $paths = git diff --name-only $before $after -- 'release-notes/v*.md'
            if ($LASTEXITCODE -ne 0) {
              throw '读取本次变更的版本说明失败'
            }
            $files = @($paths | Where-Object {
              $_ -match '^release-notes/v\d+\.\d+\.\d+(?:\.\d+)?\.md$' -and (Test-Path -LiteralPath $_)
            } | ForEach-Object { Get-Item -LiteralPath $_ } | Sort-Object Name)
          }
          if ($files.Count -eq 0) {
            Write-Output 'skip=no changed release notes'
            exit 0
          }
          foreach ($file in $files) {
            $tag = $file.BaseName
            $output = Join-Path $env:RUNNER_TEMP "$tag-release-notes.md"
            ./scripts/build-release-notes.ps1 -Tag $tag -OutputPath $output

            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              Write-Output "skip=$tag (Release 尚不存在)"
              continue
            }

            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $output
            if ($LASTEXITCODE -ne 0) {
              throw "更新 GitHub Release 失败：$tag"
            }
            Write-Output "synced=$tag"
          }
