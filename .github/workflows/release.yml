name: Release extension package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Extension -in '.zip', '.exe', '.sha256'
          } | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes
